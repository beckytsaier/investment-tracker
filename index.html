<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>投資紀錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ── Theme variables ── */
:root {
  --bg:      #1a1a24;
  --bg2:     #22222f;
  --bg3:     #0f0f14;
  --border:  #2e2e42;
  --text:    #f1f1f6;
  --muted:   #8888aa;
  --accent:  #f97316;
}
body.light {
  --bg:      #f4f4f8;
  --bg2:     #ffffff;
  --bg3:     #e8e8f0;
  --border:  #d8d8e8;
  --text:    #1a1a2e;
  --muted:   #777799;
  --accent:  #f97316;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Noto Sans TC',sans-serif;color:var(--text);min-height:100vh;transition:background .2s,color .2s;}
::-webkit-scrollbar{display:none;}
button,input,select,textarea{font-family:inherit;outline:none;}
.page{display:none;flex-direction:column;min-height:100vh;}
.page.active{display:flex;}
.header{background:var(--bg);padding:20px 20px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
.body{flex:1;overflow-y:auto;padding:16px 20px 90px;}
.btn-primary{width:100%;padding:15px;border-radius:16px;border:none;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.btn-back{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;padding:0;margin-bottom:12px;display:block;}
.chip{padding:8px 14px;border-radius:10px;border:none;font-size:13px;font-weight:500;cursor:pointer;background:var(--bg2);color:var(--muted);}
.chip.active{background:var(--accent);color:#fff;}
.chip.red.active{background:#ef4444;color:#fff;}
.chip.green.active{background:#22c55e;color:#fff;}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.cal-nav button{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 10px;}
.cal-title{font-size:22px;font-weight:700;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);padding-bottom:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{display:flex;flex-direction:column;align-items:center;padding:8px 0;cursor:pointer;border-radius:12px;}
.cal-day:hover{background:var(--bg2);}
.cal-day.today{background:#f9731622;}
.cal-day.cal-selected{background:var(--bg2);box-shadow:0 0 0 2px var(--accent);}
.cal-day.today .day-num{color:var(--accent);font-weight:700;}
.cal-day.dim{opacity:.35;}
.day-num{font-size:16px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px;}
.card{background:var(--bg2);border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--border);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.card-name-row{flex:1;min-width:0;flex-wrap:wrap;}
.card-code{font-weight:700;font-size:17px;}
.card-name{color:var(--muted);margin-left:8px;font-size:14px;}
.card-industry{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:#f9731622;color:#f97316;border:1px solid #f9731655;margin-left:6px;}
.card-merged{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;background:#3b82f622;color:#60a5fa;border:1px solid #3b82f655;margin-left:6px;}
.card-tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:var(--bg);border:1px solid var(--border);}
.card-fee{margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.card-reason{margin-top:8px;font-size:13px;color:var(--muted);}
.card-actions{display:flex;gap:10px;flex-shrink:0;}
.card-actions button{background:none;border:none;font-size:13px;cursor:pointer;}
.overlay{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;}
.overlay.show{display:flex;}
.sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px 40px;max-height:90vh;overflow-y:auto;}
.sheet-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.sheet-title span{font-size:18px;font-weight:700;}
.sheet-title button{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;}
.frow{margin-bottom:14px;}
.flabel{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;}
.finput{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:15px;display:block;}
.finput:focus{border-color:var(--accent);}
textarea.finput{resize:none;line-height:1.5;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.search-row{display:flex;gap:8px;}
.search-row input{flex:1;}
.search-btn{padding:10px 14px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.results{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-top:6px;overflow:hidden;max-height:180px;overflow-y:auto;}
.result-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:14px;}
.result-item:last-child{border-bottom:none;}
.result-item:hover{background:var(--border);}
.result-code{font-weight:700;color:var(--accent);margin-right:8px;}
.result-ind{font-size:11px;color:var(--muted);margin-left:6px;}
.selected-box{background:var(--bg2);border:1px solid #f9731644;border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.selected-box button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;}
.ind-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:#f9731622;color:#f97316;border:1px solid #f9731655;margin-left:8px;}
.amt-display{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted);}
.amt-display.on{border-color:var(--accent);box-shadow:0 0 0 2px #f9731633;}
.invest-hint{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-top:8px;}
.irow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;}
.irow .lbl{color:var(--muted);}
.irow .val{font-weight:700;color:var(--accent);}
.irow .fee{color:var(--muted);font-size:12px;font-weight:400;}
.irow .feered{color:#ef4444;font-size:12px;font-weight:700;}
.idiv{border:none;border-top:1px solid var(--border);margin:6px 0;}
.numpad{background:var(--bg3);border-radius:16px;padding:10px;margin-top:8px;}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.np-key{padding:14px;border-radius:10px;border:none;background:var(--bg2);color:var(--text);font-size:18px;font-weight:500;cursor:pointer;}
.np-key.done{background:var(--accent);color:#fff;font-size:14px;font-weight:700;}
.np-key.del{background:#ef444433;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.mode-btn{padding:12px;border-radius:14px;border:none;background:var(--bg2);color:var(--muted);font-size:13px;cursor:pointer;}
.mode-btn.active{background:var(--accent);color:#fff;font-weight:700;}
.stats-box{background:var(--bg2);border-radius:16px;border:1px solid var(--border);padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:10px;}
.stat-item{text-align:center;}
.stat-lbl{font-size:11px;color:var(--muted);margin-bottom:3px;}
.stat-val{font-size:16px;font-weight:700;}
.chart-box{background:var(--bg2);border-radius:20px;padding:20px;border:1px solid var(--border);}
.legend{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.empty-box{text-align:center;color:var(--muted);margin-top:40px;background:var(--bg2);border-radius:20px;padding:40px;border:1px solid var(--border);}
.setting-card{background:var(--bg2);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
.setting-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--accent);}
.setting-input{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:15px;width:100px;text-align:right;}
.setting-input:focus{border-color:var(--accent);}
.fee-preview{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.9;}
.fee-preview b{color:var(--text);font-weight:500;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:10;}
.nav-btn{flex:1;padding:12px 0 28px;border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
/* Theme toggle */
.theme-toggle{display:flex;background:var(--bg3);border-radius:12px;padding:4px;gap:4px;}
.theme-btn{flex:1;padding:8px 12px;border-radius:9px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.theme-btn.active{background:var(--bg2);color:var(--text);font-weight:700;box-shadow:0 1px 4px #0002;}
/* Confirm dialog */
.dlg-overlay{position:fixed;inset:0;background:#000b;z-index:100;display:none;align-items:center;justify-content:center;}
.dlg-overlay.show{display:flex;}
.dlg-box{background:var(--bg);border-radius:20px;padding:24px 20px;margin:24px;max-width:340px;width:100%;border:1px solid var(--border);}
.dlg-msg{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:20px;white-space:pre-wrap;}
.dlg-btns{display:flex;gap:10px;}
.dlg-cancel{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:14px;cursor:pointer;}
.dlg-ok{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<!-- HOME -->
<div class="page active" id="pg-home">
  <div class="header">
    <div style="font-size:11px;color:#8888aa;letter-spacing:2px;margin-bottom:6px;">我的投資紀錄</div>
    <div class="cal-nav">
      <button onclick="calPrev()">‹</button>
      <span class="cal-title" id="cal-title"></span>
      <button onclick="calNext()">›</button>
    </div>
    <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
  </div>
  <div class="body">
    <div id="cal-grid-wrap"></div>
    <div id="cal-preview"></div>
  </div>
</div>

<!-- DAILY -->
<div class="page" id="pg-daily">
  <div class="header">
    <button class="btn-back" onclick="goPage('pg-home')">‹ 返回</button>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:12px;color:#8888aa;margin-bottom:2px;">每日投資紀錄</div>
        <div style="font-size:22px;font-weight:700;" id="daily-title"></div>
      </div>
      <button style="padding:10px 18px;border-radius:14px;border:none;background:#f97316;color:#fff;font-size:14px;font-weight:600;cursor:pointer;" onclick="openForm(null)">+ 新增紀錄</button>
    </div>
  </div>
  <div class="body" id="daily-body"></div>
</div>

<!-- ANALYSIS -->
<div class="page" id="pg-analysis">
  <div class="header"><div style="font-size:22px;font-weight:700;">投資分析</div></div>
  <div class="body" id="analysis-body"></div>
</div>

<!-- SETTINGS -->
<div class="page" id="pg-settings">
  <div class="header"><div style="font-size:22px;font-weight:700;">設定</div></div>
  <div class="body">
    <div class="setting-card">
      <div class="setting-title">外觀主題</div>
      <div class="theme-toggle">
        <button class="theme-btn" id="theme-dark" onclick="setTheme('dark')">🌙 暗色</button>
        <button class="theme-btn" id="theme-light" onclick="setTheme('light')">☀️ 淺色</button>
      </div>
    </div>
    <div class="setting-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div>
          <div style="font-size:14px;">手續費折扣</div>
          <div style="font-size:11px;color:#8888aa;">標準費率 0.1425%</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <input class="setting-input" id="s-discount" type="number" min="1" max="10" step="0.1" value="10" oninput="updateFeePreview()"/>
          <span style="color:#8888aa;font-size:13px;">折</span>
        </div>
      </div>
      <div class="fee-preview" id="fee-preview"></div>
    </div>
    <div class="setting-card">
      <div class="setting-title">交易稅說明</div>
      <div style="font-size:13px;color:#8888aa;line-height:1.9;">
        交易稅依類型自動套用：<br>
        • 一般股票賣出：<b>0.3%</b><br>
        • ETF 賣出：<b>0.1%</b><br>
        • 買入不課交易稅
      </div>
    </div>
    <div class="setting-card">
      <div class="setting-title">資料備份與還原</div>
      <div style="font-size:13px;color:#8888aa;margin-bottom:14px;line-height:1.8;">換手機或清除瀏覽器前，請先匯出備份檔。還原時重新匯入即可。</div>
      <button onclick="exportData()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #2e2e42;background:#22222f;color:#f1f1f6;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;">📤 匯出備份（下載 JSON 檔）</button>
      <button onclick="document.getElementById('import-input').click()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #2e2e42;background:#22222f;color:#f1f1f6;font-size:14px;font-weight:600;cursor:pointer;">📥 匯入備份（還原資料）</button>
      <input type="file" id="import-input" accept=".json" style="display:none;" onchange="importData(event)"/>
      <div id="import-msg" style="margin-top:10px;font-size:13px;text-align:center;"></div>
    </div>
    <button class="btn-primary" onclick="saveSettings()">儲存設定</button>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="goPage('pg-home')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>首頁
  </button>
  <button class="nav-btn" id="nav-analysis" onclick="goPage('pg-analysis')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>分析
  </button>
  <button class="nav-btn" id="nav-settings" onclick="goPage('pg-settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>設定
  </button>
</div>

<!-- Confirm Dialog -->
<div class="dlg-overlay" id="dlg-overlay">
  <div class="dlg-box">
    <div class="dlg-msg" id="dlg-msg"></div>
    <div class="dlg-btns">
      <button class="dlg-cancel" id="dlg-cancel"></button>
      <button class="dlg-ok" id="dlg-ok"></button>
    </div>
  </div>
</div>

<!-- Form Overlay -->
<div class="overlay" id="form-overlay">
  <div class="sheet">
    <div class="sheet-title">
      <span id="form-title-text">新增紀錄</span>
      <button onclick="closeForm()">×</button>
    </div>
    <div class="frow">
      <label class="flabel">股票代碼 / 名稱查詢</label>
      <div class="search-row">
        <input class="finput" id="f-search" placeholder="輸入代碼或名稱…" oninput="onSearchInput()"/>
        <button class="search-btn" onclick="doSearch()">查詢</button>
        <button class="search-btn" style="background:var(--bg2);color:var(--accent);border:1px solid var(--accent);" onclick="openManualInput()">手動</button>
      </div>
      <div id="f-results" class="results" style="display:none;"></div>
    </div>
    <div class="frow" id="f-selected-row" style="display:none;">
      <label class="flabel">已選股票</label>
      <div class="selected-box">
        <span id="f-selected-text"></span>
        <button onclick="clearStock()">×</button>
      </div>
    </div>
    <div class="frow">
      <label class="flabel">類型</label>
      <div class="chip-row" id="f-type-row"></div>
    </div>
    <div class="frow">
      <label class="flabel">操作</label>
      <div class="chip-row" id="f-action-row"></div>
    </div>
    <div class="frow">
      <label class="flabel" id="f-price-label">買入價格</label>
      <input class="finput" id="f-price" type="number" step="any" placeholder="0.00" oninput="calcInvest()"/>
    </div>
    <div class="frow">
      <label class="flabel">張數 (0.001 ~ 500)</label>
      <input class="finput" id="f-lots" type="number" step="any" placeholder="例：1" oninput="calcInvest()"/>
    </div>
    <div id="f-invest-row" style="display:none;margin-bottom:14px;">
      <div class="invest-hint" id="f-invest-hint"></div>
    </div>
    <div class="frow">
      <label class="flabel">交易原因</label>
      <textarea class="finput" id="f-reason" rows="2" placeholder="填寫交易理由…"></textarea>
    </div>
    <div class="frow">
      <label class="flabel">損益</label>
      <div class="chip-row" id="f-pl-row" style="margin-bottom:10px;"></div>
      <div id="f-pl-section" style="display:none;">
        <div class="amt-display" id="f-amt-display" onclick="toggleNP('amount')">點擊輸入金額</div>
        <div id="np-amount" style="display:none;"></div>
      </div>
    </div>
    <div class="frow" id="f-rate-row" style="display:none;">
      <label class="flabel">報酬率</label>
      <div class="amt-display" id="f-rate-display" onclick="toggleNP('rate')">點擊輸入報酬率</div>
      <div id="np-rate" style="display:none;"></div>
    </div>
    <button class="btn-primary" style="margin-top:8px;" onclick="saveRec()">儲存</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// CONFIRM DIALOG
// ═══════════════════════════════════════════
function showConfirm(msg, onOk, okLbl, cancelLbl) {
  okLbl = okLbl || '確定';
  cancelLbl = cancelLbl || '取消';
  var ov = document.getElementById('dlg-overlay');
  document.getElementById('dlg-msg').textContent = msg;
  document.getElementById('dlg-ok').textContent = okLbl;
  document.getElementById('dlg-cancel').textContent = cancelLbl;
  ov.classList.add('show');
  document.getElementById('dlg-ok').onclick = function() { ov.classList.remove('show'); onOk(); };
  document.getElementById('dlg-cancel').onclick = function() { ov.classList.remove('show'); };
}
function showConfirmAsync(msg, okLbl, cancelLbl) {
  okLbl = okLbl || '確定';
  cancelLbl = cancelLbl || '取消';
  return new Promise(function(resolve) {
    var ov = document.getElementById('dlg-overlay');
    document.getElementById('dlg-msg').textContent = msg;
    document.getElementById('dlg-ok').textContent = okLbl;
    document.getElementById('dlg-cancel').textContent = cancelLbl;
    ov.classList.add('show');
    document.getElementById('dlg-ok').onclick = function() { ov.classList.remove('show'); resolve(true); };
    document.getElementById('dlg-cancel').onclick = function() { ov.classList.remove('show'); resolve(false); };
  });
}

// FEE HELPERS
// ═══════════════════════════════════════════
function isETF(code) { return /^00\d/.test(code) || /^[A-Z]/i.test(code); }
function feeRate() { return 0.1425 / 100 * (settings.discount / 10); }
function calcFee(price, lots, action, stockType, code) {
  var amt = price * lots * 1000;
  var fr = feeRate();
  var commBuy = action === '買入' ? Math.max(1, Math.floor(amt * fr)) : 0;
  var commSell = action === '賣出' ? Math.max(1, Math.floor(amt * fr)) : 0;
  var taxRate = action === '賣出' ? (isETF(code) ? 0.001 : 0.003) : 0;
  var tax = Math.floor(amt * taxRate);
  return { commBuy: commBuy, commSell: commSell, tax: tax, total: commBuy + commSell + tax };
}

});
function searchStock(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  var res = [], etfRes = [];
  var keys = Object.keys(DB);
  for (var i = 0; i < keys.length; i++) {
    var code = keys[i], info = DB[code];
    if (code.toLowerCase().startsWith(q) || info.name.includes(q)) {
      var item = { code: code, name: info.name, industry: info.industry };
      if (info.industry === 'ETF') etfRes.push(item);
      else res.push(item);
    }
    if (res.length >= 6 && etfRes.length >= 4) break;
  }
  var combined = (q.startsWith('00') || q === '0') ? etfRes.concat(res) : res.concat(etfRes);
  return combined.slice(0, 8);
}

function setTheme(t) {
  settings.theme = t;
  document.body.classList.toggle('light', t === 'light');
  var db = document.getElementById('theme-dark'), lb = document.getElementById('theme-light');
  if (db) db.classList.toggle('active', t !== 'light');
  if (lb) lb.classList.toggle('active', t === 'light');
}
function updateFeePreview() {
  var d = parseFloat(document.getElementById('s-discount').value) || 10;
  var rate = (0.1425 * (d / 10)).toFixed(4);
  var ex = Math.max(1, Math.floor(100000 * parseFloat(rate) / 100));
  var tax = Math.floor(100000 * 0.003);
  var etax = Math.floor(100000 * 0.001);
  document.getElementById('fee-preview').innerHTML =
    '手續費率：<b>' + rate + '%</b>（' + d + '折）<br>' +
    '買10萬 手續費：<b>$' + ex + '</b><br>' +
    '賣10萬股票 手續費：<b>$' + ex + '</b> ＋ 稅：<b>$' + tax + '</b><br>' +
    '賣10萬ETF 手續費：<b>$' + ex + '</b> ＋ 稅：<b>$' + etax + '</b>';
}
function saveSettings() {
  var d = parseFloat(document.getElementById('s-discount').value) || 10;
  if (d < 1 || d > 10) { showConfirm('折扣請填 1～10 折', function(){},'確定',''); return; }
  settings = { discount: d, theme: settings.theme || 'dark' }; persistSettings(settings);
  showConfirm('設定已儲存！', function(){}, '確定', '');
}
function exportData() {
  var payload = { version: 1, exportedAt: new Date().toISOString(), records: records, settings: settings };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url; a.download = '投資紀錄備份_' + ds + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importData(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var payload = JSON.parse(ev.target.result);
      if (!payload.records) throw new Error('格式錯誤');
      var dateStr = payload.exportedAt || '不明';
      showConfirm('確定要還原備份？\n匯出時間：' + dateStr + '\n\n⚠️ 這將覆蓋目前所有資料！', function() {
        records = payload.records;
        if (payload.settings) settings = payload.settings;
        persist(records); persistSettings(settings);
        document.getElementById('import-msg').innerHTML = '<span style="color:#22c55e;">✅ 還原成功！</span>';
        document.getElementById('s-discount').value = settings.discount || 10;
        updateFeePreview();
        setTimeout(function() { document.getElementById('import-msg').innerHTML = ''; }, 3000);
      }, '還原', '取消');
    } catch(err) {
      document.getElementById('import-msg').innerHTML = '<span style="color:#ef4444;">❌ 檔案格式不正確</span>';
    }
    document.getElementById('import-input').value = '';
  };
  reader.readAsText(file);
}

function goPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  var nm = { 'pg-home':'nav-home', 'pg-analysis':'nav-analysis', 'pg-settings':'nav-settings' };
  if (nm[id]) document.getElementById(nm[id]).classList.add('active');
  if (id === 'pg-home') renderCal();
  if (id === 'pg-daily') renderDaily();
  if (id === 'pg-analysis') renderAnalysis();
  if (id === 'pg-settings') { document.getElementById('s-discount').value = settings.discount; updateFeePreview(); setTheme(settings.theme || 'dark'); }
}

function calPrev() { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); }
function calNext() { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); }
function renderCal() {
  document.getElementById('cal-title').textContent = calY + ' \u00b7 ' + MZ[calM];
  var days = new Date(calY, calM+1, 0).getDate(), first = new Date(calY, calM, 1).getDay();
  var h = '<div class="cal-grid">';
  for (var i = 0; i < first; i++) { var d = new Date(calY, calM, -first+i+1); h += '<div class="cal-day dim"><span class="day-num">' + d.getDate() + '</span></div>'; }
  for (var d2 = 1; d2 <= days; d2++) {
    var date = new Date(calY, calM, d2), k = dk(date), isT = k === todayK, dot = records[k] && records[k].length > 0;
    var isSel = k === selDate;
    h += '<div class="cal-day' + (isT ? ' today' : '') + (isSel ? ' cal-selected' : '') + '" onclick="selDay(\'' + k + '\')">' +
      '<span class="day-num">' + d2 + '</span>' +
      (dot ? '<div class="dot"></div>' : '<div style="height:7px"></div>') + '</div>';
  }
  var rem = 7 - ((first + days) % 7); if (rem < 7) for (var j = 1; j <= rem; j++) h += '<div class="cal-day dim"><span class="day-num">' + j + '</span></div>';
  h += '</div>';
  document.getElementById('cal-grid-wrap').innerHTML = h;
  renderCalPreview();
}
function selDay(k) {
  selDate = k;
  renderCal();
}
function renderCalPreview() {
  var wrap = document.getElementById('cal-preview');
  if (!wrap) return;
  var recs = records[selDate] || [];
  if (!recs.length) { wrap.innerHTML = ''; return; }
  var d = new Date(selDate + 'T00:00:00');
  var dateStr = (d.getMonth()+1) + '/' + d.getDate();
  var escaped = selDate.replace(/'/g, "\\'");
  var h = '<div style="margin-top:16px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
      '<span style="font-size:13px;color:var(--muted);">' + dateStr + '\u00a0\u5171 ' + recs.length + ' \u7b46</span>' +
      '<button onclick="selDate=\'' + escaped + '\';goPage(\'pg-daily\')" style="background:none;border:1px solid var(--border);border-radius:10px;padding:4px 12px;font-size:12px;color:var(--accent);cursor:pointer;">\u67e5\u770b\u8a73\u60c5 \u203a</button>' +
    '</div>';
  recs.forEach(function(r) {
    var ac = r.action === '\u8cb7\u5165' ? '#ef4444' : '#22c55e';
    var pl = (r.plType === '\u640d\u76ca' && r.plAmount !== '') ? parseFloat(r.plAmount) : null;
    var plStr = pl !== null ? '<span style="color:' + (pl>=0?'#ef4444':'#22c55e') + ';font-size:12px;font-weight:700;">' + (pl>=0?'+':'') + pl.toLocaleString() + '</span>' : '';
    h += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
      '<div style="min-width:0;">' +
        '<span style="font-weight:700;font-size:15px;">' + (r.code||'') + '</span>' +
        '<span style="color:var(--muted);font-size:13px;margin-left:6px;">' + (r.name||'') + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
        '<span style="font-size:12px;color:var(--muted);">' + r.stockType + '</span>' +
        '<span style="font-size:13px;font-weight:600;color:' + ac + ';">' + r.action + '</span>' +
        '<span style="font-size:13px;">$' + r.price + '\u00d7' + r.lots + '\u5f35</span>' +
        plStr +
      '</div>' +
    '</div>';
  });
  h += '</div>';
  wrap.innerHTML = h;

var editIdx = null;
var F = { code:'', name:'', industry:'', stockType:'現股', action:'買入', plType:'無', plAmount:'', returnRate:'', _autoFilled:false };

// FIFO cost calc
function getFIFOBuyQueue(code, name, excludeDate, excludeIdx) {
  var queue = [];
  var allDates = Object.keys(records).sort();
  for (var di = 0; di < allDates.length; di++) {
    var dt = allDates[di], recs = records[dt] || [];
    for (var ri = 0; ri < recs.length; ri++) {
      if (dt === excludeDate && ri === excludeIdx) continue;
      var r = recs[ri];
      var id = r.code || r.name, matchId = code || name;
      if (id !== matchId || r.action !== '買入') continue;
      var lots = parseFloat(r.lots) || 0, price = parseFloat(r.price) || 0;
      if (lots > 0 && price > 0) queue.push({ lots: lots, price: price, stockType: r.stockType });
    }
  }
  return queue;
}

function autoCalcPL(code, name, sellPrice, sellLots, sellStockType, excludeDate, excludeIdx) {
  var sp = parseFloat(sellPrice) || 0, sl = parseFloat(sellLots) || 0;
  if (!sp || !sl) return null;

  if (sellStockType === '融券') {
    // Find short (融券賣出) queue
    var shortQueue = [];
    var allDates = Object.keys(records).sort();
    for (var di = 0; di < allDates.length; di++) {
      var dt = allDates[di], recs2 = records[dt] || [];
      for (var ri = 0; ri < recs2.length; ri++) {
        if (dt === excludeDate && ri === excludeIdx) continue;
        var r2 = recs2[ri];
        var id2 = r2.code || r2.name;
        if (id2 !== (code || name)) continue;
        if (r2.stockType === '融券' && r2.action === '賣出') {
          var lots2 = parseFloat(r2.lots) || 0, price2 = parseFloat(r2.price) || 0;
          if (lots2 > 0 && price2 > 0) shortQueue.push({ lots: lots2, price: price2 });
        }
      }
    }
    var remaining = sl, totalShortAmt = 0, totalShortLots = 0;
    for (var qi = 0; qi < shortQueue.length; qi++) {
      if (remaining <= 0) break;
      var used = Math.min(remaining, shortQueue[qi].lots);
      totalShortAmt += shortQueue[qi].price * used * 1000;
      totalShortLots += used; remaining -= used;
    }
    if (totalShortLots <= 0) return null;
    var matchedLots = Math.min(sl, totalShortLots);
    var buyBackAmt = sp * matchedLots * 1000;
    var grossPL = totalShortAmt - buyBackAmt;
    var fSell = calcFee(totalShortAmt / totalShortLots / 1000, matchedLots, '賣出', '融券', code || '');
    var fBuy = calcFee(sp, matchedLots, '買入', '融券', code || '');
    var netPL = Math.round(grossPL - fSell.total - fBuy.total);
    var costBase = Math.floor((totalShortAmt / totalShortLots / 1000) * matchedLots * 1000 * 0.9);
    var roi = costBase > 0 ? ((netPL / costBase) * 100) : 0;
    return { pl: netPL, roi: parseFloat(roi.toFixed(2)) };
  }

  // General (現股/融資)
  var queue = getFIFOBuyQueue(code, name, excludeDate, excludeIdx);
  var rem2 = sl, totalCost = 0, totalLots = 0;
  for (var qi2 = 0; qi2 < queue.length; qi2++) {
    if (rem2 <= 0) break;
    var used2 = Math.min(rem2, queue[qi2].lots);
    totalCost += queue[qi2].price * used2 * 1000;
    totalLots += used2; rem2 -= used2;
  }
  if (totalLots <= 0) return null;
  var ml = Math.min(sl, totalLots);
  var sellAmt = sp * ml * 1000;
  var costAmt = totalLots > 0 ? totalCost * (ml / totalLots) : totalCost;
  var grossPL2 = sellAmt - costAmt;
  var avgBuyP = totalLots > 0 ? totalCost / (totalLots * 1000) : 0;
  var fBuy2 = calcFee(avgBuyP, ml, '買入', sellStockType, code || '');
  var fSell2 = calcFee(sp, ml, '賣出', sellStockType, code || '');
  var netPL2 = Math.round(grossPL2 - fBuy2.total - fSell2.total);
  var costBase2 = sellStockType === '融資' ? Math.round(costAmt * 0.6) : Math.round(costAmt);
  var roi2 = costBase2 > 0 ? ((netPL2 / costBase2) * 100) : 0;
  return { pl: netPL2, roi: parseFloat(roi2.toFixed(2)) };
}

function calcInvest() {
  var p = parseFloat(document.getElementById('f-price').value) || 0;
  var l = parseFloat(document.getElementById('f-lots').value) || 0;
  var row = document.getElementById('f-invest-row');
  var isBuy = F.action === '買入';
  var isSell = F.action === '賣出';
  var isMarginShort = isSell && F.stockType === '融券';

  // Auto-calc PL on sell
  if (isSell && p > 0 && l > 0 && (F.code || F.name) && F.plType === '損益') {
    var result = autoCalcPL(F.code, F.name, p, l, F.stockType, selDate, editIdx);
    if (result && F._autoFilled !== false || F.plAmount === '') {
      if (F.plAmount === '' || F._autoFilled) {
        F.plAmount = String(result ? result.pl : '');
        F.returnRate = String(result ? result.roi : '');
        F._autoFilled = true;
        updAmt(); updRate();
        document.getElementById('f-rate-row').style.display = F.plAmount !== '' ? 'block' : 'none';
      }
    }
  }

  var hint = document.getElementById('f-invest-hint');

  if (isBuy && p > 0 && l > 0) {
    var base = p * l * 1000;
    var f = calcFee(p, l, F.action, F.stockType, F.code || '');
    var investAmt, investLabel;
    if (F.stockType === '融資') { investAmt = Math.round(base * 0.6); investLabel = '融資保證金(估，6成)'; }
    else { investAmt = Math.round(base); investLabel = '預估投資額'; }
    var etm = isETF(F.code || '') ? '(ETF)' : '';
    var fLines = '';
    if (f.commBuy > 0) fLines += '<div class="irow"><span class="lbl">手續費</span><span class="fee">$' + f.commBuy.toLocaleString() + '</span></div>';
    hint.innerHTML = '<div class="irow"><span class="lbl">' + investLabel + '</span><span class="val">$' + investAmt.toLocaleString() + '</span></div>' +
      (fLines ? '<hr class="idiv">' + fLines + '<div class="irow"><span class="lbl">合計費用</span><span class="feered">$' + f.total.toLocaleString() + '</span></div>' : '');
    row.style.display = 'block';
  } else if (isMarginShort && p > 0 && l > 0) {
    var base2 = p * l * 1000;
    var f2 = calcFee(p, l, F.action, F.stockType, F.code || '');
    var margin = Math.floor(base2 * 0.9);
    hint.innerHTML = '<div class="irow"><span class="lbl">融券保證金(估，9成)</span><span class="val">$' + margin.toLocaleString() + '</span></div>' +
      '<hr class="idiv"><div class="irow"><span class="lbl">手續費</span><span class="fee">$' + f2.commSell.toLocaleString() + '</span></div>' +
      '<div class="irow"><span class="lbl">交易稅</span><span class="fee">$' + f2.tax.toLocaleString() + '</span></div>' +
      '<div class="irow"><span class="lbl">合計費用</span><span class="feered">$' + f2.total.toLocaleString() + '</span></div>';
    row.style.display = 'block';
  } else if (isSell && p > 0 && l > 0) {
    var f3 = calcFee(p, l, F.action, F.stockType, F.code || '');
    var etm3 = isETF(F.code || '') ? '(ETF)' : '';
    hint.innerHTML = '<div class="irow"><span class="lbl">手續費</span><span class="fee">$' + f3.commSell.toLocaleString() + '</span></div>' +
      '<div class="irow"><span class="lbl">交易稅' + etm3 + '</span><span class="fee">$' + f3.tax.toLocaleString() + '</span></div>' +
      '<div class="irow"><span class="lbl">合計費用</span><span class="feered">$' + f3.total.toLocaleString() + '</span></div>';
    row.style.display = 'block';
  } else {
    row.style.display = 'none';
  }
}

    keys.map(function(k) { return '<button class="np-key' + (k==='⌫'?' del':'') + '" onclick="npPress(\'' + field + '\',\'' + k + '\')">' + k + '</button>'; }).join('') +
    '<button class="np-key done" onclick="closeNP()">完成</button></div></div>';

function npPress(field, v) {
  var key = field === 'amount' ? 'plAmount' : 'returnRate';
  var p = F[key] || '';
  if (v === '⌫') p = p.slice(0, -1);
  else if (v === '+/-') p = p.startsWith('-') ? p.slice(1) : (p ? '-' + p : '-');
  else if (v === '.') p = p.includes('.') ? p : p + '.';
  else p += v;
  F[key] = p;
  F._autoFilled = false;
  if (field === 'amount') { updAmt(); document.getElementById('f-rate-row').style.display = (F.plType==='損益'&&p!=='') ? 'block' : 'none'; }
  else updRate();
}

function recalcRelatedPL(stockId) {
  if (!stockId) return;
  var allDates = Object.keys(records).sort();
  var updated = 0;
  for (var di = 0; di < allDates.length; di++) {
    var dt = allDates[di];
    var recs = records[dt] || [];
    for (var ri = 0; ri < recs.length; ri++) {
      var r = recs[ri];
      if ((r.code || r.name) !== stockId) continue;
      if (r.action !== '賣出' && !(r.stockType === '融券' && r.action === '買入')) continue;
      // 只重算有損益欄位的賣出紀錄
      if (r.plType !== '損益') continue;
      var result = autoCalcPL(r.code, r.name, r.price, r.lots, r.stockType, dt, ri);
      if (result) {
        recs[ri] = Object.assign({}, r, { plAmount: String(result.pl), returnRate: String(result.roi) });
        updated++;
      }
    }
    records[dt] = recs;
  }
  return updated;
}

function saveRec() {
  if (!F.code && !F.name) { showConfirm('請先查詢並選擇股票', function(){}, '確定', ''); return; }
  var price = document.getElementById('f-price').value.trim();
  var lots = document.getElementById('f-lots').value.trim();
  var reason = document.getElementById('f-reason').value.trim();
  if (!price) { showConfirm('請填寫價格', function(){}, '確定', ''); return; }
  if (!lots) { showConfirm('請填寫張數', function(){}, '確定', ''); return; }
  var ln = parseFloat(lots);
  if (isNaN(ln) || ln < 0.001 || ln > 500) { showConfirm('張數須介於 0.001 ~ 500', function(){}, '確定', ''); return; }

  var rec = { code:F.code, name:F.name, industry:F.industry, stockType:F.stockType, action:F.action, price:price, lots:lots, reason:reason, plType:F.plType, plAmount:F.plAmount, returnRate:F.returnRate };
  var l = (records[selDate] || []).slice();

  if (editIdx !== null) {
    l[editIdx] = rec;
    records[selDate] = l;
    // 重算所有同股票的賣出損益
    recalcRelatedPL(F.code || F.name);
    persist(records); closeForm(); renderDaily();
    return;
  }

  // Check merge
  var id = F.code || F.name;
  var mergeIdx = -1;
  for (var i = 0; i < l.length; i++) {
    var ex = l[i];
    if ((ex.code||ex.name) === id && ex.action === F.action && ex.stockType === F.stockType && (!ex.plType || ex.plType === '無') && (!F.plType || F.plType === '無')) {
      mergeIdx = i; break;
    }
  }

  if (mergeIdx >= 0) {
    var exist = l[mergeIdx];
    var existLots = parseFloat(exist.lots) || 0, existPrice = parseFloat(exist.price) || 0;
    var totalLots = existLots + ln;
    var avgPrice = ((existPrice * existLots) + (parseFloat(price) * ln)) / totalLots;
    var mergedReason = [exist.reason, reason].filter(Boolean).join('、');
    showConfirm(
      '偵測到同天已有 ' + (exist.name||exist.code) + ' ' + exist.action + ' ' + existLots + '張 @$' + existPrice + '\n\n是否合併為均價 $' + avgPrice.toFixed(2) + '、共 ' + totalLots + '張？',
      function() {
        l[mergeIdx] = Object.assign({}, exist, { lots: String(totalLots), price: avgPrice.toFixed(2), reason: mergedReason, _merged: true });
        records[selDate] = l; persist(records); closeForm(); renderDaily();
      },
      '合併', '另存一筆'
    );
    // Handle "另存一筆" via cancel button
    document.getElementById('dlg-cancel').onclick = function() {
      document.getElementById('dlg-overlay').classList.remove('show');
      l.push(rec); records[selDate] = l; persist(records); closeForm(); renderDaily();
    };
  } else {
    l.push(rec); records[selDate] = l; persist(records); closeForm(); renderDaily();
  }
}

// ═══════════════════════════════════════════
// ANALYSIS
// ═══════════════════════════════════════════
var anaMode = 'total';
function renderAnalysis() {
  var now = new Date(), ty = now.getFullYear(), tm = now.getMonth();
  var profit = 0, loss = 0, hasAny = false, totalInvest = 0, totalFees = 0;
  var stockMap = {};

  // First pass: build stockMap to know which 融券 positions are covered
  var stockMapPre = {};
  Object.keys(records).forEach(function(dk2) {
    var d = new Date(dk2 + 'T00:00:00');
    var inc = (anaMode==='total' || (anaMode==='year'&&d.getFullYear()===ty) || (anaMode==='month'&&d.getFullYear()===ty&&d.getMonth()===tm) || (anaMode==='today'&&dk2===todayK));
    if (!inc) return;
    (records[dk2] || []).forEach(function(r) {
      var id = r.code || r.name; if (!id) return;
      if (!stockMapPre[id]) stockMapPre[id] = { shortLots:0, coverLots:0 };
      var lots = parseFloat(r.lots)||0;
      if (r.stockType === '融券') {
        if (r.action==='賣出'&&lots>0) stockMapPre[id].shortLots += lots;
        else if (r.action==='買入'&&lots>0) stockMapPre[id].coverLots += lots;
      }
    });
  });

  Object.keys(records).forEach(function(dk2) {
    var d = new Date(dk2 + 'T00:00:00');
    var inc = (anaMode==='total' || (anaMode==='year'&&d.getFullYear()===ty) || (anaMode==='month'&&d.getFullYear()===ty&&d.getMonth()===tm) || (anaMode==='today'&&dk2===todayK));
    if (!inc) return;
    (records[dk2] || []).forEach(function(r) {
      var id = r.code || r.name; if (!id) return;
      if (!stockMap[id]) stockMap[id] = { buyLots:0, buyAmount:0, soldLots:0, shortLots:0, shortAvgMargin:0, coverLots:0 };
      var lots = parseFloat(r.lots)||0, price = parseFloat(r.price)||0, base = price*lots*1000;
      // Only count fees for completed trades:
      // 融券: only count fees if the position has been (at least partially) covered
      if (price > 0 && lots > 0) {
        var isFusion = r.stockType === '融券';
        var sm = stockMapPre[id] || { shortLots:0, coverLots:0 };
        var isCovered = !isFusion || sm.coverLots > 0;
        if (!isFusion || isCovered) {
          var f = calcFee(price, lots, r.action, r.stockType, r.code||''); totalFees += f.total;
        }
      }
      if (r.stockType === '融券') {
        if (r.action==='賣出'&&lots>0&&price>0) {
          var prev = stockMap[id].shortLots * stockMap[id].shortAvgMargin;
          var nm = Math.floor(base * 0.9);
          stockMap[id].shortLots += lots;
          stockMap[id].shortAvgMargin = stockMap[id].shortLots > 0 ? (prev + nm) / stockMap[id].shortLots : 0;
        } else if (r.action==='買入'&&lots>0) stockMap[id].coverLots += lots;
      } else if (r.stockType === '融資') {
        if (r.action==='買入'&&lots>0&&price>0) { stockMap[id].buyLots+=lots; stockMap[id].buyAmount+=Math.round(base*0.6); }
        else if (r.action==='賣出'&&lots>0) stockMap[id].soldLots+=lots;
      } else {
        if (r.action==='買入'&&lots>0&&price>0) { stockMap[id].buyLots+=lots; stockMap[id].buyAmount+=base; }
        else if (r.action==='賣出'&&lots>0) stockMap[id].soldLots+=lots;
      }
      if (r.plType==='損益'&&r.plAmount!=='') { var v=parseFloat(r.plAmount); if(!isNaN(v)){hasAny=true;if(v>0)profit+=v;else loss+=Math.abs(v);} }
    });
  });

  Object.keys(stockMap).forEach(function(id) {
    var s = stockMap[id];
    if (s.soldLots > 0 && s.buyLots > 0) {
      var avg = s.buyAmount / (s.buyLots * 1000);
      totalInvest += Math.round(avg * Math.min(s.soldLots, s.buyLots) * 1000);
    }
    if (s.coverLots > 0 && s.shortLots > 0) {
      totalInvest += Math.round(s.shortAvgMargin * Math.min(s.coverLots, s.shortLots));
    }
  });

  var net = profit - loss;
  var modes = [{k:'total',l:'已實現總損益'},{k:'year',l:'年度損益'},{k:'month',l:'當月損益'},{k:'today',l:'當日損益'}];
  var mLbl = {total:'已實現總損益',year:'當年總損益',month:'當月總損益',today:'當日損益'};
  var iLbl = {total:'總計投資額',year:'年度投資額',month:'當月投資額',today:'當日投資額'};

  var h = '<div class="mode-grid">' + modes.map(function(m) {
    return '<button class="mode-btn' + (anaMode===m.k?' active':'') + '" onclick="anaMode=\'' + m.k + '\';renderAnalysis()">' + m.l + '</button>';
  }).join('') + '</div>';

  if (hasAny || totalInvest > 0) {
    var nc = net >= 0 ? '#ef4444' : '#22c55e';
    var roi = totalInvest > 0 ? ((net/totalInvest)*100) : null;
    h += '<div class="stats-box">' +
      '<div class="stat-item"><div class="stat-lbl">' + mLbl[anaMode] + '</div><div class="stat-val" style="color:' + nc + '">' + (net>=0?'+':'') + net.toLocaleString() + '</div></div>' +
    '</div><div class="stats-box">' +
      '<div class="stat-item"><div class="stat-lbl">' + iLbl[anaMode] + '</div><div class="stat-val" style="color:#f97316;">$' + Math.round(totalInvest).toLocaleString() + '</div></div>' +
      (roi !== null ? '<div class="stat-item"><div class="stat-lbl">投報率</div><div class="stat-val" style="color:' + (roi>=0?'#ef4444':'#22c55e') + '">' + (roi>=0?'+':'') + roi.toFixed(2) + '%</div></div>' : '') +
    '</div>';
  }

  if (hasAny) {
    h += '<div class="chart-box"><canvas id="pie-c" width="280" height="200" style="display:block;margin:0 auto"></canvas><div class="legend">' +
      (profit>0 ? '<div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>正報酬 +' + profit.toLocaleString() + '</div>' : '') +
      (loss>0 ? '<div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>損失 -' + loss.toLocaleString() + '</div>' : '') +
    '</div></div>';
  } else if (!totalInvest) {
    h += '<div class="empty-box">無交易紀錄</div>';
  }

  document.getElementById('analysis-body').innerHTML = h;

  if (hasAny) {
    var cv = document.getElementById('pie-c'), ctx = cv.getContext('2d');
    var data = [{v:profit,c:'#ef4444'},{v:loss,c:'#22c55e'}].filter(function(d){return d.v>0;});
    var total = data.reduce(function(a,d){return a+d.v;}, 0);
    var start = -Math.PI / 2;
    data.forEach(function(d) {
      var angle = (d.v / total) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(140,100); ctx.arc(140,100,80,start,start+angle);
      ctx.fillStyle = d.c; ctx.fill();
      var mid = start + angle / 2;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.round(d.v/total*100)+'%', 140+Math.cos(mid)*52, 100+Math.sin(mid)*52);
      start += angle;
    });
  }
}

// ── Init ──
setTheme(settings.theme || 'dark');
updateFeePreview();
renderCal();
</script>

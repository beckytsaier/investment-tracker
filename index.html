<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>投資紀錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1a24;font-family:'Noto Sans TC',sans-serif;color:#f1f1f6;min-height:100vh;}
::-webkit-scrollbar{display:none;}
button,input,select,textarea{font-family:inherit;outline:none;}

/* ── Layout ── */
.page{display:none;flex-direction:column;min-height:100vh;}
.page.active{display:flex;}
.header{background:#1a1a24;padding:20px 20px 16px;border-bottom:1px solid #2e2e42;position:sticky;top:0;z-index:5;}
.body{flex:1;overflow-y:auto;padding:16px 20px;}
.footer{background:#1a1a24;border-top:1px solid #2e2e42;padding:16px 20px 36px;}

/* ── Buttons ── */
.btn-primary{width:100%;padding:15px;border-radius:16px;border:none;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.btn-back{background:none;border:none;color:#f97316;font-size:15px;cursor:pointer;padding:0;margin-bottom:12px;display:block;}
.chip{padding:8px 14px;border-radius:10px;border:none;font-size:13px;font-weight:500;cursor:pointer;background:#22222f;color:#8888aa;transition:background .15s;}
.chip.active{background:#f97316;color:#fff;}
.chip.red.active{background:#ef4444;color:#fff;}
.chip.green.active{background:#22c55e;color:#fff;}

/* ── Calendar ── */
.cal-title{font-size:22px;font-weight:700;margin-bottom:4px;}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.cal-nav button{background:none;border:none;color:#f97316;font-size:22px;cursor:pointer;padding:4px 10px;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:#8888aa;padding-bottom:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{display:flex;flex-direction:column;align-items:center;padding:8px 0;cursor:pointer;border-radius:12px;}
.cal-day:hover{background:#22222f;}
.cal-day.today{background:#f9731622;}
.cal-day.today .day-num{color:#f97316;font-weight:700;}
.cal-day.dim{opacity:.35;}
.day-num{font-size:16px;}
.dot{width:5px;height:5px;border-radius:50%;background:#f97316;margin-top:2px;}

/* ── Record Card ── */
.card{background:#22222f;border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid #2e2e42;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.card-code{font-weight:700;font-size:17px;}
.card-name{color:#8888aa;margin-left:8px;font-size:14px;}
.card-tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:#1a1a24;border:1px solid #2e2e42;}
.card-reason{margin-top:8px;font-size:13px;color:#8888aa;}
.card-actions{display:flex;gap:10px;}
.card-actions button{background:none;border:none;font-size:13px;cursor:pointer;}

/* ── Form overlay ── */
.overlay{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;}
.form-sheet{width:100%;background:#1a1a24;border-radius:24px 24px 0 0;padding:20px 20px 40px;max-height:90vh;overflow-y:auto;}
.form-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.form-title span{font-size:18px;font-weight:700;}
.form-title button{background:none;border:none;color:#8888aa;font-size:24px;cursor:pointer;}
.form-row{margin-bottom:14px;}
.form-label{font-size:12px;color:#8888aa;margin-bottom:6px;display:block;}
.form-input{width:100%;background:#22222f;border:1px solid #2e2e42;border-radius:12px;padding:10px 14px;color:#f1f1f6;font-size:15px;}
.form-input:focus{border-color:#f97316;}
textarea.form-input{resize:none;line-height:1.5;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ── Numpad ── */
.numpad{background:#0f0f14;border-radius:16px;padding:10px;margin-top:8px;}
.numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.numpad-key{padding:14px;border-radius:10px;border:none;background:#22222f;color:#f1f1f6;font-size:18px;font-weight:500;cursor:pointer;}
.numpad-key.done{background:#f97316;color:#fff;font-size:14px;font-weight:700;}
.numpad-key.del{background:#ef444433;}
.amount-display{background:#22222f;border:1px solid #2e2e42;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;min-height:44px;display:flex;align-items:center;color:#8888aa;}
.amount-display.active{border-color:#f97316;box-shadow:0 0 0 2px #f9731633;}

/* ── Analysis ── */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.mode-btn{padding:12px;border-radius:14px;border:none;background:#22222f;color:#8888aa;font-size:13px;cursor:pointer;}
.mode-btn.active{background:#f97316;color:#fff;font-weight:700;}
.net-box{text-align:center;padding:16px;background:#22222f;border-radius:20px;border:1px solid #2e2e42;margin-bottom:16px;}
.net-label{font-size:13px;color:#8888aa;margin-bottom:6px;}
.net-value{font-size:32px;font-weight:800;}
.chart-box{background:#22222f;border-radius:20px;padding:20px;border:1px solid #2e2e42;}
.legend{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#8888aa;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.empty-box{text-align:center;color:#8888aa;margin-top:40px;background:#22222f;border-radius:20px;padding:40px;border:1px solid #2e2e42;}
</style>
</head>
<body>

<!-- ── HOME PAGE ── -->
<div class="page active" id="pg-home">
  <div class="header">
    <div style="font-size:11px;color:#8888aa;letter-spacing:2px;margin-bottom:6px;">我的投資紀錄</div>
    <div class="cal-nav">
      <button onclick="calPrev()">‹</button>
      <span class="cal-title" id="cal-title"></span>
      <button onclick="calNext()">›</button>
    </div>
    <div class="weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
  </div>
  <div class="body" id="cal-grid-wrap"></div>
  <div class="footer">
    <button class="btn-primary" onclick="goPage('pg-analysis')">📊 投資分析</button>
  </div>
</div>

<!-- ── DAILY PAGE ── -->
<div class="page" id="pg-daily">
  <div class="header">
    <button class="btn-back" onclick="goPage('pg-home')">‹ 返回</button>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:12px;color:#8888aa;margin-bottom:2px;">每日投資紀錄</div>
        <div style="font-size:22px;font-weight:700;" id="daily-title"></div>
      </div>
      <button style="padding:10px 18px;border-radius:14px;border:none;background:#f97316;color:#fff;font-size:14px;font-weight:600;cursor:pointer;" onclick="openForm(null)">+ 新增紀錄</button>
    </div>
  </div>
  <div class="body" id="daily-body"></div>
</div>

<!-- ── ANALYSIS PAGE ── -->
<div class="page" id="pg-analysis">
  <div class="header">
    <button class="btn-back" onclick="goPage('pg-home')">‹ 返回</button>
    <div style="font-size:22px;font-weight:700;">投資分析</div>
  </div>
  <div class="body" id="analysis-body"></div>
</div>

<!-- ── FORM OVERLAY ── -->
<div class="overlay" id="form-overlay" style="display:none;">
  <div class="form-sheet">
    <div class="form-title">
      <span id="form-title-text">新增紀錄</span>
      <button onclick="closeForm()">×</button>
    </div>
    <div class="form-row">
      <label class="form-label">股票代碼</label>
      <input class="form-input" id="f-code" placeholder="例：2330" oninput="syncCode()" onblur="lookupCode()"/>
    </div>
    <div class="form-row">
      <label class="form-label">股票名稱</label>
      <input class="form-input" id="f-name" placeholder="例：台積電" oninput="syncName()" onblur="lookupName()"/>
    </div>
    <div class="form-row">
      <label class="form-label">類型</label>
      <div class="chip-row" id="f-type-row"></div>
    </div>
    <div class="form-row">
      <label class="form-label">操作</label>
      <div class="chip-row" id="f-action-row"></div>
    </div>
    <div class="form-row">
      <label class="form-label">價格</label>
      <input class="form-input" id="f-price" type="number" placeholder="0.00"/>
    </div>
    <div class="form-row">
      <label class="form-label">交易原因</label>
      <textarea class="form-input" id="f-reason" rows="2" placeholder="填寫交易理由…"></textarea>
    </div>
    <div class="form-row">
      <label class="form-label">損益</label>
      <div class="chip-row" id="f-pl-row" style="margin-bottom:10px;"></div>
      <div id="f-pl-section" style="display:none;">
        <div class="amount-display" id="f-amount-display" onclick="toggleNumpad('amount')">點擊輸入金額</div>
        <div id="numpad-amount" style="display:none;"></div>
      </div>
    </div>
    <div class="form-row" id="f-rate-row-wrap" style="display:none;">
      <label class="form-label">報酬率</label>
      <div class="amount-display" id="f-rate-display" onclick="toggleNumpad('rate')">點擊輸入報酬率</div>
      <div id="numpad-rate" style="display:none;"></div>
    </div>
    <button class="btn-primary" style="margin-top:8px;" onclick="saveRecord()">儲存</button>
  </div>
</div>

<script>
// ── Data ──
const TWSE={"2330":"台積電","2317":"鴻海","2454":"聯發科","2412":"中華電","2882":"國泰金","2881":"富邦金","2886":"兆豐金","1301":"台塑","2308":"台達電","3008":"大立光","2002":"中鋼","1303":"南亞","2303":"聯電","2891":"中信金","5880":"合庫金","2884":"玉山金","2885":"元大金","2892":"第一金","2883":"開發金","2890":"永豐金"};
const N2C=Object.fromEntries(Object.entries(TWSE).map(([k,v])=>[v,k]));
const SK="inv-v3";
function load(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch{return{};}}
function persist(r){try{localStorage.setItem(SK,JSON.stringify(r));}catch{}}
let records=load();

// ── Date ──
const TODAY=new Date();
function dk(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const todayK=dk(TODAY);
let calY=TODAY.getFullYear(), calM=TODAY.getMonth();
let selDate=todayK;

// ── Pages ──
function goPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='pg-home') renderCal();
  if(id==='pg-daily') renderDaily();
  if(id==='pg-analysis') renderAnalysis();
}

// ── Calendar ──
const MZ=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
function calPrev(){calM--;if(calM<0){calM=11;calY--;}renderCal();}
function calNext(){calM++;if(calM>11){calM=0;calY++;}renderCal();}
function renderCal(){
  document.getElementById('cal-title').textContent=`${calY} · ${MZ[calM]}`;
  const days=new Date(calY,calM+1,0).getDate();
  const first=new Date(calY,calM,1).getDay();
  let html='<div class="cal-grid">';
  // prev month
  for(let i=0;i<first;i++){
    const d=new Date(calY,calM,-first+i+1);
    html+=`<div class="cal-day dim"><span class="day-num">${d.getDate()}</span></div>`;
  }
  // this month
  for(let d=1;d<=days;d++){
    const date=new Date(calY,calM,d);
    const k=dk(date);
    const isT=k===todayK;
    const hasDot=records[k]&&records[k].length>0;
    html+=`<div class="cal-day${isT?' today':''}" onclick="selDay('${k}')">
      <span class="day-num">${d}</span>
      ${hasDot?'<div class="dot"></div>':'<div style="height:7px"></div>'}
    </div>`;
  }
  // next month fill
  const total=first+days;
  const rem=7-(total%7);
  if(rem<7) for(let i=1;i<=rem;i++) html+=`<div class="cal-day dim"><span class="day-num">${i}</span></div>`;
  html+='</div>';
  document.getElementById('cal-grid-wrap').innerHTML=html;
}

function selDay(k){selDate=k;goPage('pg-daily');}

// ── Daily ──
function renderDaily(){
  const d=new Date(selDate+'T00:00:00');
  document.getElementById('daily-title').textContent=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  const recs=records[selDate]||[];
  const body=document.getElementById('daily-body');
  if(recs.length===0){body.innerHTML='<div style="text-align:center;color:#8888aa;margin-top:60px;font-size:15px;">今日尚無紀錄<br><span style="font-size:12px;">點擊「新增紀錄」開始</span></div>';return;}
  body.innerHTML=recs.map((r,i)=>{
    const pl=plLabel(r);
    const ac=r.action==='買入'?'#ef4444':'#22c55e';
    const tags=[
      `<span class="tag">${r.stockType}</span>`,
      `<span class="tag" style="color:${ac}">${r.action}</span>`,
      `<span class="tag">$${r.price}</span>`,
      pl?`<span class="tag" style="color:${parseFloat(r.plAmount)>=0?'#ef4444':'#22c55e'}">${pl}</span>`:'',
      r.returnRate?`<span class="tag" style="color:${parseFloat(r.returnRate)>=0?'#ef4444':'#22c55e'}">${parseFloat(r.returnRate)>=0?'+':''}${r.returnRate}%</span>`:''
    ].join('');
    return`<div class="card">
      <div class="card-top">
        <div><span class="card-code">${r.code}</span><span class="card-name">${r.name}</span></div>
        <div class="card-actions">
          <button style="color:#f97316" onclick="openForm(${i})">編輯</button>
          <button style="color:#8888aa" onclick="delRecord(${i})">刪除</button>
        </div>
      </div>
      <div class="card-tags">${tags}</div>
      ${r.reason?`<div class="card-reason">${r.reason}</div>`:''}
    </div>`;
  }).join('');
}

function plLabel(r){
  if(r.plType==='損益'&&r.plAmount!==''){const v=parseFloat(r.plAmount);return isNaN(v)?'':(v>=0?`+${v}`:`${v}`);}return'';
}

function delRecord(i){
  if(!confirm('確定刪除？'))return;
  const l=[...(records[selDate]||[])];l.splice(i,1);
  records[selDate]=l;persist(records);renderDaily();
}

// ── Form ──
let editIndex=null;
let fDraft={stockType:'現股',action:'買入',plType:'無',plAmount:'',returnRate:''};

function openForm(idx){
  editIndex=idx;
  const recs=records[selDate]||[];
  if(idx!==null){
    const r=recs[idx];
    document.getElementById('f-code').value=r.code||'';
    document.getElementById('f-name').value=r.name||'';
    document.getElementById('f-price').value=r.price||'';
    document.getElementById('f-reason').value=r.reason||'';
    fDraft={stockType:r.stockType||'現股',action:r.action||'買入',plType:r.plType||'無',plAmount:r.plAmount||'',returnRate:r.returnRate||''};
    document.getElementById('form-title-text').textContent='編輯紀錄';
  } else {
    document.getElementById('f-code').value='';
    document.getElementById('f-name').value='';
    document.getElementById('f-price').value='';
    document.getElementById('f-reason').value='';
    fDraft={stockType:'現股',action:'買入',plType:'無',plAmount:'',returnRate:''};
    document.getElementById('form-title-text').textContent='新增紀錄';
  }
  renderFormChips();
  renderPlSection();
  document.getElementById('form-overlay').style.display='flex';
}

function closeForm(){document.getElementById('form-overlay').style.display='none';}

function renderFormChips(){
  const types=['現股','融券','融資','零股'];
  document.getElementById('f-type-row').innerHTML=types.map(t=>`<button class="chip${fDraft.stockType===t?' active':''}" onclick="fDraft.stockType='${t}';renderFormChips()">${t}</button>`).join('');
  const actions=['買入','賣出'];
  document.getElementById('f-action-row').innerHTML=actions.map(a=>`<button class="chip${fDraft.action===a?' '+(a==='買入'?'red':'green')+' active':''}" onclick="fDraft.action='${a}';renderFormChips()">${a}</button>`).join('');
  const pls=['無','損益'];
  document.getElementById('f-pl-row').innerHTML=pls.map(p=>`<button class="chip${fDraft.plType===p?' active':''}" onclick="setPlType('${p}')">${p}</button>`).join('');
}

function setPlType(t){fDraft.plType=t;if(t==='無'){fDraft.plAmount='';fDraft.returnRate='';}renderFormChips();renderPlSection();}

function renderPlSection(){
  const show=fDraft.plType==='損益';
  document.getElementById('f-pl-section').style.display=show?'block':'none';
  document.getElementById('f-rate-row-wrap').style.display=(show&&fDraft.plAmount!=='')?'block':'none';
  updateAmountDisplay();
  updateRateDisplay();
}

function updateAmountDisplay(){
  const el=document.getElementById('f-amount-display');
  if(!el)return;
  const v=parseFloat(fDraft.plAmount);
  el.style.color=fDraft.plAmount===''?'#8888aa':(!isNaN(v)&&v>=0?'#ef4444':'#22c55e');
  el.textContent=fDraft.plAmount!==''?`${(!isNaN(v)&&v>=0)?'+':''}${fDraft.plAmount} 元`:'點擊輸入金額';
}
function updateRateDisplay(){
  const el=document.getElementById('f-rate-display');
  if(!el)return;
  const v=parseFloat(fDraft.returnRate);
  el.style.color=fDraft.returnRate===''?'#8888aa':(!isNaN(v)&&v>=0?'#ef4444':'#22c55e');
  el.textContent=fDraft.returnRate!==''?`${(!isNaN(v)&&v>=0)?'+':''}${fDraft.returnRate} %`:'點擊輸入報酬率';
}

let activeNP=null;
function toggleNumpad(field){
  activeNP=activeNP===field?null:field;
  const aEl=document.getElementById('f-amount-display');
  const rEl=document.getElementById('f-rate-display');
  if(aEl)aEl.classList.toggle('active',activeNP==='amount');
  if(rEl)rEl.classList.toggle('active',activeNP==='rate');
  renderNumpad('amount');
  renderNumpad('rate');
}

function renderNumpad(field){
  const wrap=document.getElementById(`numpad-${field}`);
  if(!wrap)return;
  if(activeNP!==field){wrap.style.display='none';return;}
  wrap.style.display='block';
  const keys=["7","8","9","4","5","6","1","2","3","+/-","0",".","⌫"];
  wrap.innerHTML=`<div class="numpad"><div class="numpad-grid">
    ${keys.map(k=>`<button class="numpad-key${k==='⌫'?' del':''}" onclick="npPress('${field}','${k}')">${k}</button>`).join('')}
    <button class="numpad-key done" onclick="activeNP=null;renderNumpad('amount');renderNumpad('rate');document.getElementById('f-amount-display').classList.remove('active');document.getElementById('f-rate-display')&&document.getElementById('f-rate-display').classList.remove('active');">完成</button>
  </div></div>`;
}

function npPress(field,v){
  const key=field==='amount'?'plAmount':'returnRate';
  let p=fDraft[key]||'';
  if(v==='⌫')p=p.slice(0,-1);
  else if(v==='+/-')p=p.startsWith('-')?p.slice(1):(p?'-'+p:'-');
  else if(v==='.')p=p.includes('.')?p:p+'.';
  else p=p+v;
  fDraft[key]=p;
  if(field==='amount'){updateAmountDisplay();document.getElementById('f-rate-row-wrap').style.display=(fDraft.plType==='損益'&&p!=='')?'block':'none';}
  else updateRateDisplay();
}

function syncCode(){fDraft._code=document.getElementById('f-code').value;}
function syncName(){fDraft._name=document.getElementById('f-name').value;}
function lookupCode(){const c=document.getElementById('f-code').value.trim();if(TWSE[c])document.getElementById('f-name').value=TWSE[c];}
function lookupName(){const n=document.getElementById('f-name').value.trim();if(N2C[n])document.getElementById('f-code').value=N2C[n];}

function saveRecord(){
  const code=document.getElementById('f-code').value.trim();
  const name=document.getElementById('f-name').value.trim();
  const price=document.getElementById('f-price').value.trim();
  const reason=document.getElementById('f-reason').value.trim();
  if(!code&&!name){alert('請填寫股票代碼或名稱');return;}
  if(!price){alert('請填寫價格');return;}
  const rec={code,name,stockType:fDraft.stockType,action:fDraft.action,price,reason,plType:fDraft.plType,plAmount:fDraft.plAmount,returnRate:fDraft.returnRate};
  const l=[...(records[selDate]||[])];
  if(editIndex!==null)l[editIndex]=rec;else l.push(rec);
  records[selDate]=l;persist(records);
  closeForm();renderDaily();
}

// ── Analysis ──
let analysisMode='total';
function renderAnalysis(){
  const now=new Date(),ty=now.getFullYear(),tm=now.getMonth();
  let profit=0,loss=0,hasAny=false;
  Object.entries(records).forEach(([dk2,recs])=>{
    const d=new Date(dk2+'T00:00:00');
    const inc=(analysisMode==='total'||(analysisMode==='year'&&d.getFullYear()===ty)||(analysisMode==='month'&&d.getFullYear()===ty&&d.getMonth()===tm)||(analysisMode==='today'&&dk2===todayK));
    if(!inc)return;
    recs.forEach(r=>{if(r.plType==='損益'&&r.plAmount!==''){const v=parseFloat(r.plAmount);if(!isNaN(v)){hasAny=true;if(v>0)profit+=v;else loss+=Math.abs(v);}}});
  });
  const net=profit-loss;
  const modes=[{k:'total',l:'已實現總損益'},{k:'year',l:'年度損益'},{k:'month',l:'當月損益'},{k:'today',l:'當日損益'}];
  let html=`<div class="mode-grid">${modes.map(m=>`<button class="mode-btn${analysisMode===m.k?' active':''}" onclick="analysisMode='${m.k}';renderAnalysis()">${m.l}</button>`).join('')}</div>`;
  if(hasAny){
    const netColor=net>=0?'#ef4444':'#22c55e';
    html+=`<div class="net-box"><div class="net-label">淨損益</div><div class="net-value" style="color:${netColor}">${net>=0?'+':''}${net.toLocaleString()}</div></div>`;
    html+=`<div class="chart-box"><canvas id="pie-canvas" width="280" height="200" style="display:block;margin:0 auto;"></canvas><div class="legend">`;
    if(profit>0) html+=`<div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>正報酬 +${profit.toLocaleString()}</div>`;
    if(loss>0) html+=`<div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>損失 -${loss.toLocaleString()}</div>`;
    html+=`</div></div>`;
  } else {
    html+=`<div class="empty-box"><div style="font-size:40px;margin-bottom:12px;">📭</div>無交易紀錄</div>`;
  }
  document.getElementById('analysis-body').innerHTML=html;
  if(hasAny){
    const canvas=document.getElementById('pie-canvas');
    const ctx=canvas.getContext('2d');
    const data=[{v:profit,c:'#ef4444'},{v:loss,c:'#22c55e'}].filter(d=>d.v>0);
    const total=data.reduce((a,d)=>a+d.v,0);
    let start=-Math.PI/2,cx=140,cy=100,r=80;
    data.forEach(d=>{
      const angle=(d.v/total)*Math.PI*2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+angle);
      ctx.fillStyle=d.c;ctx.fill();
      const mid=start+angle/2;
      ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(Math.round(d.v/total*100)+'%',cx+Math.cos(mid)*r*.65,cy+Math.sin(mid)*r*.65);
      start+=angle;
    });
  }
}

// ── Init ──
renderCal();
</script>
</body>
</html>
